name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # ffprobe only. Without --no-install-recommends apt pulls ~100 packages (GPU drivers, speech models)
      # and a slow mirror once stalled the job past its 10-minute limit.
      - run: sudo apt-get install -y --no-install-recommends ffmpeg
        timeout-minutes: 4
      - run: uv sync
      - run: uv run pytest -q --cov=vaniloop --cov-report=term-missing --cov-fail-under=80

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync
      - run: bin/check
        env:
          SKIP_TESTS: "1"
