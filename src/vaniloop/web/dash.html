<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vaniloop dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='4' fill='%23CDB58A'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/dash.css">
<link rel="stylesheet" href="/static/console.css">
<script defer src="/static/dash.js"></script>
<script defer src="/static/console.js"></script>
</head>
<body>
<a class="skip" href="#panel">Skip to the page</a>
<div class="shell">
  <header class="bar">
    <a class="mark" href="#/home">vaniloop<i aria-hidden="true"></i></a>
    <button class="menu" type="button" aria-expanded="false" aria-controls="side"><span id="menu-now">Menu</span><b aria-hidden="true"></b></button>
  </header>
  <aside id="side" class="side" aria-label="Pipeline">
    <a class="mark big" href="#/home">vaniloop<i aria-hidden="true"></i></a>
    <p class="side-sub">VANI call quality</p>
    <nav id="nav" aria-label="Panels"></nav>
    <p id="side-foot" class="side-foot"></p>
  </aside>
  <main id="panel" tabindex="-1"></main>
</div>
<div id="dock" class="dock" role="region" aria-label="Current job" hidden>
  <div class="dock-bar"><span id="dock-info" class="dock-info" role="status"></span><span id="dock-actions" class="dock-actions"></span></div>
  <pre id="dock-log" class="dock-log" tabindex="0" aria-label="Job log" hidden></pre>
</div>
</body>
</html>
